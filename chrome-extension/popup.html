<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dyslexia Mode Toggle</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      min-width: 270px;
      background: #181c24;
      color: #f3f3f3;
      border-radius: 12px;
      box-shadow: 0 2px 16px #0003;
      padding: 0 0 18px 0;
    }
    .header {
      background: linear-gradient(90deg, #6a82fb 0%, #fc5c7d 100%);
      padding: 18px 0 10px 0;
      border-radius: 12px 12px 0 0;
      text-align: center;
      font-size: 1.2em;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .container {
      padding: 0 18px;
    }
    .toggle-switch {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      justify-content: space-between;
    }
    .switch {
      width: 40px;
      height: 22px;
      position: relative;
      appearance: none;
      background: #444;
      outline: none;
      border-radius: 22px;
      transition: background 0.3s;
      cursor: pointer;
    }
    .switch:checked {
      background: #6a82fb;
    }
    .switch::before {
      content: '';
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      background: #fff;
      transition: 0.3s;
    }
    .switch:checked::before {
      left: 20px;
      background: #fff;
    }
    .section { margin-bottom: 14px; }
    label { font-size: 15px; }
    .status { margin-bottom: 12px; font-weight: bold; color: #6a82fb; }
    .slider-label { display: flex; justify-content: space-between; }
    #font-size-slider {
      width: 100%;
      accent-color: #fc5c7d;
      margin-top: 2px;
    }
    #bg-color-select {
      width: 100%;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #444;
      background: #222;
      color: #f3f3f3;
    }
    .reset-btn {
      margin-top: 10px;
      width: 100%;
      padding: 8px;
      background: linear-gradient(90deg, #fc5c7d 0%, #6a82fb 100%);
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      box-shadow: 0 2px 8px #0002;
      transition: background 0.2s;
    }
    .reset-btn:hover {
      background: linear-gradient(90deg, #6a82fb 0%, #fc5c7d 100%);
    }
  </style>
</head>
<body>
  <div class="header">Dyslexia Mode</div>
  <div class="container">
    <div class="toggle-switch section">
      <label for="dyslexia-toggle">Dyslexia Mode</label>
      <input type="checkbox" id="dyslexia-toggle" class="switch" aria-label="Toggle Dyslexia Mode">
    </div>
    <div class="status" id="status-text">Checking status...</div>
    <div class="section">
      <div class="slider-label">
        <label for="font-size-slider">Font Size</label>
        <span id="font-size-value">100%</span>
      </div>
      <input type="range" min="80" max="200" value="100" id="font-size-slider" aria-label="Font Size">
    </div>
    <div class="section">
      <label for="bg-color-select">Background Color</label>
      <select id="bg-color-select" aria-label="Background Color">
        <option value="">Default</option>
        <option value="#f5eacb">Sepia</option>
        <option value="#222">Dark</option>
        <option value="#fff">Light</option>
      </select>
    </div>
    <button class="reset-btn" id="reset-btn">Reset to Default</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
